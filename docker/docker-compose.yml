services:
  spark:
    image: docker.io/bitnami/spark:3.5
    environment:
      - AWS_PROFILE=default
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - SPARK_HADOOP_FS_S3A_IMPL=org.apache.hadoop.fs.s3a.S3AFileSystem
    ports:
      - '8080:8080'
    volumes:
      - ~/.aws:/root/.aws
      - ./data:/opt/spark/work-dir/spark-warehouse/data:rw
      - ./jars/hadoop-aws-3.4.1.jar:/opt/bitnami/spark/jars/hadoop-aws-3.4.1.jar
      - ./jars/aws-java-sdk-bundle-1.12.781.jar:/opt/bitnami/spark/jars/aws-java-sdk-bundle-1.12.781.jar
  
  spark-connect:
    image: docker.io/bitnami/spark:3.5
    container_name: spark-connect
    hostname: spark-connect
    ports:
      - "4040:4040"
      - "15002:15002"
    depends_on:
      - spark
    volumes:
      - ./jars/spark-connect_2.12-3.5.1.jar:/opt/spark/jars/spark-connect_2.12-3.5.1.jar
      - ./data:/opt/spark/work-dir/spark-warehouse/data:rw
    
  spark-worker:
    image: docker.io/bitnami/spark:3.5
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
